<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pertemuan 11</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Daftar Akun</h2>
            <form th:action="@{/register}" th:object="${request}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Masukkan password" required>
                </div>
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" th:field="*{nama}" placeholder="Masukkan nama lengkap" required>
                </div>
                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" th:field="*{alamat}" placeholder="Masukkan alamat" required>
                </div>
                <button type="submit" class="btn btn-primary">Daftar</button>
            </form>
            <p class="link-text">Sudah punya akun? <a th:href="@{/login}">Login di sini</a></p>
        </div>
    </div>
</body>
</html>
